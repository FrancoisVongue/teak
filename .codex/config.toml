model = "gpt-5.5"
approval_policy = "never"        # Stops all "Can I do this?" prompts
sandbox_mode = "danger-full-access" # The real "YOLO" mode (bypasses all sandboxing)
web_search = "live"              # Essential for looking up latest Zig/Go docs

[core]
temperature = 0.0                # Keep it deterministic for engineering
max_tokens = 32768
stream_output = true

[ux]
verbosity = "minimal"            # Kills the "I hope this helps" chatter
show_thinking_process = false
interactive_mode = false
follow_up_questions = false
syntax_highlighting = true

[workspace]
# Auto-index for better RAG context on your Piano/nlkz projects
auto_index_threshold = 1000
ignore_patterns = [".git", "node_modules", "target", "zig-out", "dist"]

[environment]
shell = "/bin/zsh"
env_vars = { "EDITOR" = "nvim", "CODEX_MODE" = "headless" }

