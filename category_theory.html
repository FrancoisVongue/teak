  {id:"data",label:"Данные",g:"data",info:"Копируемые типы: числа, struct, enum, Handle. Cartesian-категория: есть произведение ×, сумма +, диагональ Δ (копия) и отбрасывание ! ."},
  {id:"lin",label:"Ресурсы",g:"lin",info:"Линейные типы: Region, Socket. Symmetric monoidal без cartesian-структуры — нет Δ (копии) и нет ! (отбрасывания). Линейность = выкинуть диагональ."},

  {id:"eff",label:"Async",g:"eff",info:"Эффект НЕ вынесен в монаду. await/spawn/yield компилируются в state-machine + io_uring. Категория типов остаётся без async-монады — функции не «красятся»."},
  {id:"raw",label:"*T / FFI",g:"raw",info:"Сырой указатель — отдельный объект, граница с внешним миром. Теряет gen ровно здесь, как и линейные ресурсы."},
 ],
 edges:[
  {a:"mem",b:"data",l:"Handle копируем ∈"},
  {a:"lin",b:"mem",l:"Region линеен"},
  {a:"gen",b:"data",l:"функтор над"},
  {a:"eff",b:"data",l:"НЕ монада в типах",neg:true},

 desc:`<h3>Идея</h3><p>orto — не одна категория, а аккуратное склеивание нескольких. Ключевой выбор: <b>данные живут в cartesian-мире</b> (копируй, отбрасывай, бери произведения и суммы), <b>ресурсы — в monoidal-мире без cartesian-структуры</b> (линейность), а <b>эффекты вообще не попадают в категорию типов</b> (async компилируется, а не типизируется монадой).</p>
 <p>Каждая вкладка раскрывает один из этих кусков как настоящий граф объектов и морфизмов.</p>`
},

 tag:"подкатегория Num",

  {id:"i32",label:"i32",g:"num"},{id:"i64",label:"i64",g:"num",
    info:"int = i64. Терминальный «рабочий» объект: to_int(_) ведёт сюда из любого числового, арифметика по умолчанию здесь."},

 ],
 edges:[
  {a:"i8",b:"i64",l:"to_int (lossless)"},
  {a:"i16",b:"i64",l:"to_int"},
  {a:"i32",b:"i64",l:"to_int"},
  {a:"u8",b:"i64",l:"to_int"},
  {a:"i64",b:"u8",l:"to_byte (trunc)"},

  {a:"i64",b:"u64",l:"to_u64"},
  {a:"i64",b:"f64",l:"to_float"},
  {a:"f64",b:"i64",l:"to_int (trunc→0)"},
 ],
 desc:`<h3>Категория числовых типов</h3>
 <p>Объекты — фиксированные ширины (<code>i8..i128</code>, <code>u8..u128</code>, <code>f16..f128</code>). Морфизмы — <b>явные касты</b> <code>to_int</code>, <code>to_byte</code>, <code>to_u32</code>, <code>to_float</code>… Композиция = цепочка кастов, <code>id</code> = каст типа в себя.</p>
 <h3>Почему всё через <code>i64</code></h3>
 <p><code>int = i64</code> играет роль «хаба»: расширения в него <span class="k">lossless</span> (моно-стрелки), сужения из него — усекают. Ровно один общий механизм каста <code>to_&lt;T&gt;</code> порождает все стрелки — нет отдельных правил на каждую пару (это и есть N+M вместо N²).</p>
 <h3>Закон явности</h3>
 <p>Нет неявных коэрций: <code>i32 + i64</code> — ошибка, не «магия». Каждая стрелка в коде видна. Это категория, где морфизмы не подставляются молча.</p>`
},

prodsum:{
 title:"Произведение и сумма (struct / enum)",
 tag:"бикартезианость",
 nodes:[
  {id:"P",label:"struct S",g:"data",info:"S = A × B. Поля — проекции π. Конструктор S{a,b} — универсальная стрелка в произведение."},
  {id:"A",label:"A",g:"data"},{id:"B",label:"B",g:"data"},
  {id:"one",label:"() = 1",g:"unit",info:"Unit — терминальный объект. Из любого типа есть ровно одна стрелка в 1 (отбрасывание). Эффекты возвращают ()."},
  {id:"S",label:"enum E",g:"data",info:"E = A + B. Конструкторы вариантов — инъекции inl/inr. match — универсальная стрелка ИЗ суммы (копроизведение)."},
 ],
 edges:[
  {a:"P",b:"A",l:"π₁ (поле .a)"},
  {a:"P",b:"B",l:"π₂ (поле .b)"},
  {a:"P",b:"one",l:"! (в терминал)"},
  {a:"A",b:"S",l:"inl (ctor)"},
  {a:"B",b:"S",l:"inr (ctor)"},
  {a:"S",b:"one",l:"match → ()"},
 ],
 desc:`<h3>Данные = (ко)произведения</h3>
 <p>CLAUDE.md прямо говорит «типы суммы и произведения». Категориально это буквально так:</p>
 <p><b>struct</b> = <b>произведение</b> A×B: поля — проекции π₁,π₂; <code>S{a,b}</code> — единственная стрелка, согласованная с проекциями (универсальное свойство ×).</p>
 <p><b>enum</b> = <b>копроизведение</b> A+B: конструкторы — инъекции inl,inr; <code>match</code> — единственная стрелка из суммы, заданная по веткам (универсальное свойство +).</p>
 <p><b>()</b> = <b>терминальный объект 1</b>: единственная стрелка <code>!</code> в него = «отбросить». Эффекты (<code>:=</code>, <code>while</code>, <code>print</code>) возвращают <code>()</code>.</p>
 <h3>Бикартезианость</h3>
 <p>Есть и ×, и + — это бикартезианая категория. Никаких «классов» и наследования: данные строятся ровно двумя двойственными операциями, и всё.</p>`
},

memory:{
 title:"Память: cartesian vs monoidal",
 tag:"линейность = нет Δ",
 nodes:[
  {id:"int",label:"int",g:"data",info:"Копируемый. Есть диагональ Δ: int→int×int (копия) и ! : int→1 (отбрасывание)."},
  {id:"h",label:"Handle[T]",g:"data",info:"Копируемый gen-checked хендл. Тоже cartesian: можно копировать и отбрасывать. Безопасность даёт рантайм gen-check, не линейность."},
  {id:"reg",label:"Region",g:"lin",info:"Линейный владелец. НЕТ Δ (нельзя скопировать владельца) и НЕТ ! (нельзя молча отбросить — drop в конце scope обязателен)."},
  {id:"sock",label:"Socket",g:"lin",info:"linear struct + drop_Socket. Monoidal-объект: можно двигать (move), нельзя дублировать."},
  {id:"copy",label:"A×A",g:"data",info:"Результат копирования. Доступен только для cartesian-объектов."},
  {id:"one",label:"1",g:"unit",info:"Терминал. Отбрасывание ! есть только у cartesian-объектов."},
 ],
 edges:[
  {a:"int",b:"copy",l:"Δ копия"},
  {a:"h",b:"copy",l:"Δ копия"},
  {a:"int",b:"one",l:"! отбросить"},
  {a:"reg",b:"copy",l:"Δ запрещена",neg:true},
  {a:"reg",b:"one",l:"! запрещено",neg:true},
  {a:"sock",b:"copy",l:"Δ запрещена",neg:true},
 ],
 desc:`<h3>Точная теорема, а не метафора</h3>
 <p>Cartesian-категория имеет <b>диагональ</b> Δ:A→A×A (копирование) и <b>отбрасывание</b> !:A→1. Линейная логика по Curry–Howard–Lambek — это <b>симметричная моноидальная категория без</b> этих двух стрелок.</p>
 <p>orto-линейность — ровно это: <code>linear</code>-тип теряет Δ и ! . «Нельзя скопировать» = нет диагонали; «нельзя забыть» (обязательный drop) = нет свободного отбрасывания. Не спецправило — выпадение cartesian-структуры.</p>
 <h3>Где живёт Handle</h3>
 <p><code>Handle[T]</code> остаётся <b>cartesian</b> (копируем, отбрасываем) — безопасность ему даёт <span class="k">рантайм gen-check</span>, а не линейность. Поэтому он удобен (много алиасов), а владелец памяти (<code>Region</code>) — линеен.</p>
 <h3>Доступ как частичный морфизм</h3>
 <p><code>r[i]</code> — частичная стрелка (может <code>abort</code>). <code>try_at(r,i): Option[T]</code> — её тотализация: стрелка <b>Клейсли</b> монады Option. Один и тот же доступ в двух обличьях.</p>`
},

functor:{
 title:"Дженерики = функторы, параметричность = естественность",
 tag:"functor / nat. transf.",
 nodes:[
  {id:"T",label:"T",g:"data"},{id:"U",label:"U",g:"data"},
  {id:"HT",label:"Handle[T]",g:"func",info:"Объект-применение функтора Handle[-] к T."},
  {id:"HU",label:"Handle[U]",g:"func"},
  {id:"OT",label:"Option[T]",g:"func",info:"Ещё один эндофунктор. fmap поднимает f:T→U в Option[T]→Option[U]."},
  {id:"id",label:"∀A. A→A",g:"eff",info:"Параметрическая ∀A.A→A — естественное преобразование Id⇒Id. По параметричности (Yoneda) у него ровно ОДИН элемент: id. Отсюда «free theorems»."},
 ],
 edges:[
  {a:"T",b:"U",l:"f"},
  {a:"HT",b:"HU",l:"fmap f"},
  {a:"OT",b:"HT",l:"≅ структурно"},
  {a:"T",b:"HT",l:"Handle[-]"},
  {a:"U",b:"HU",l:"Handle[-]"},
  {a:"id",b:"T",l:"компонент в T"},
 ],
 desc:`<h3>Generic-тип — это функтор</h3>
 <p><code>Handle[-]</code>, <code>Option[-]</code>, <code>Result[-]</code> — <b>эндофункторы</b> на категории типов: переводят объект T в объект <code>Handle[T]</code> и стрелку f:T→U в <code>fmap f</code>, сохраняя <code>id</code> и композицию. Мономорфизация просто инстанцирует функтор на конкретном объекте.</p>
 <h3>Параметричность = естественность</h3>
 <p>Generic-функция, которая «не заглядывает внутрь T» (наш закон: T — запечатанная коробка), — это <b>естественное преобразование</b>. Квадрат естественности — это и есть «free theorem».</p>
 <p><code>∀A. A→A</code> может быть только <code>id</code>; <code>∀A. [A]→[A]</code> — только перестановка, не трогая элементы. Это <b>не вежливость, а теорема</b> (Yoneda/параметричность).</p>
 <h3>Почему нет classes/bounds</h3>
 <p>Constraint <code>where T: Ord</code> = «я заглядываю внутрь T» = функция перестаёт быть естественным преобразованием и становится семейством, индексированным инстансом (ad-hoc). orto оставляет функцию честно естественной, поведение впрыскивает значением (<code>cmp</code> аргументом/полем). Поздно + явно = точнее.</p>`
},

async:{
 title:"Async: один категория vs монада-раскраска",
 tag:"нет Kleisli-раскола",
 nodes:[
  {id:"sync",label:"fn (база)",g:"data",info:"orto: обычная функция. Все функции в ОДНОЙ категории — свободно компонуются."},
  {id:"aw",label:"await/spawn/yield",g:"eff",info:"Не монадические операторы, а маркеры точек приостановки для компилятора."},
  {id:"sm",label:"state-machine",g:"eff",info:"Компилятор (CPS-подобно) режет функцию на сегменты между await — for(;;) switch. Эффект живёт в КОМПИЛЯЦИИ, не в типе."},
  {id:"ring",label:"io_uring",g:"raw",info:"SQE подаётся, задача снимается; CQE будит. thread-per-core, shared-nothing."},
  {id:"task",label:"Task[T]/Stream[T]",g:"func",info:"Линейные builtin-хендлы на слот в пуле. Не Future-монада: нет do-нотации, нет .and_then-цепочек в типах."},
  {id:"future",label:"Future-монада (Rust/Haskell)",g:"lin",info:"Чужой подход: эффект = монада. async-функции живут в Kleisli-категории, sync — в базовой. Они НЕ компонуются напрямую → «раскраска функций»."},
 ],
 edges:[
  {a:"aw",b:"sm",l:"lowering"},
  {a:"sm",b:"ring",l:"SQE/CQE"},
  {a:"sync",b:"aw",l:"тот же мир"},
  {a:"sm",b:"task",l:"слот-пул"},
  {a:"future",b:"sync",l:"раскол категории",neg:true},
 ],
 desc:`<h3>Проблема раскраски = раскол категории</h3>
 <p>Монадический async (Rust <code>Future</code>, Haskell <code>IO</code>) кладёт эффект в <b>монаду</b>. Тогда async-функции живут в <b>Kleisli-категории</b> этой монады, а обычные — в базовой. Две категории <b>не компонуются напрямую</b>: нужно <code>await</code>/<code>lift</code> чтобы пересечь границу. Это и есть «function coloring».</p>
 <h3>Выбор orto: одна категория</h3>
 <p>orto <b>отказывается выносить эффект в типы</b>. <code>await</code>/<code>spawn</code>/<code>yield</code> — это маркеры для компилятора, который CPS-подобно превращает тело в state-machine (<code>for(;;) switch</code>) и привязывает к io_uring. В <b>исходной</b> категории типов нет async-монады — функции остаются обычными стрелками и свободно компонуются.</p>
 <h3>Чем платим / почему так</h3>
 <p>Go тоже избегает раскраски (одна категория), но ценой M:N-планировщика + GC. orto держит одну категорию И thread-per-core/io_uring (макс. скорость), а монаду-эффект просто <b>компилирует</b>, а не типизирует. <code>Task[T]</code>/<code>Stream[T]</code> — линейные хендлы на слот, а не монадические обёртки.</p>`
},

const ORDER=[["overview","Обзор"],["base","Базовые типы"],["prodsum","× и + (struct/enum)"],
 ["memory","Память: cart/monoidal"],["functor","Generics = функторы"],
 ["async","Async"],["compare","Сравнение языков"]];

/* ---------- движок силовых графов ---------- */
const svg=document.getElementById("svg");
const gE=document.getElementById("edges"), gL=document.getElementById("elabels"), gN=document.getElementById("nodes");
let W=0,H=0, cur=null, drag=null, selected=null;
function size(){const r=svg.getBoundingClientRect();W=r.width;H=r.height;}
addEventListener("resize",()=>{size();});

function load(key){
  cur=JSON.parse(JSON.stringify(DATA[key]));
  size();
  const cx=W/2,cy=H/2;
  cur.nodes.forEach((n,i)=>{
    const a=i/cur.nodes.length*2*Math.PI;
    n.x=cx+Math.cos(a)*120+(Math.random()-.5)*40;
    n.y=cy+Math.sin(a)*100+(Math.random()-.5)*40;
    n.vx=0;n.vy=0;n.r=Math.max(26,n.label.length*4.2);
  });
  // dedupe key for curve offset on parallel edges
  cur.byId={}; cur.nodes.forEach(n=>cur.byId[n.id]=n);
  build(); fillSide(key); fillLegend();
  selected=null;
}

function build(){
  gE.innerHTML="";gL.innerHTML="";gN.innerHTML="";
  cur.edges.forEach((e,i)=>{
    e.path=document.createElementNS(NS,"path");
    e.path.setAttribute("class","edge"+(e.neg?" absent":""));
    if(!e.neg) e.path.setAttribute("marker-end","url(#arr)");
    gE.appendChild(e.path);
    e.lab=document.createElementNS(NS,"text");
    e.lab.setAttribute("class","elabel"+(e.neg?" neg":""));
    e.lab.textContent=e.l; gL.appendChild(e.lab);
  });
  cur.nodes.forEach(n=>{
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","node"); n.el=g;
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("r",n.r); c.setAttribute("fill",COL[n.g]||"#7aa2f7");
    const t=document.createElementNS(NS,"text"); t.setAttribute("dy","4"); t.textContent=n.label;
    g.appendChild(c);g.appendChild(t);gN.appendChild(g);
    g.addEventListener("pointerdown",ev=>{drag=n;n.fixed=true;g.setPointerCapture(ev.pointerId);ev.stopPropagation();});
    g.addEventListener("pointerup",()=>{drag=null;n.fixed=false;select(n);});
    g.addEventListener("mouseenter",()=>showInfo(n));
  });
}

svg.addEventListener("pointermove",ev=>{
  if(!drag)return; const r=svg.getBoundingClientRect();
  drag.x=ev.clientX-r.left; drag.y=ev.clientY-r.top;
});
svg.addEventListener("pointerup",()=>{if(drag){drag.fixed=false;drag=null;}});
svg.addEventListener("pointerdown",()=>{select(null);});

function step(){
  if(!cur){requestAnimationFrame(step);return;}
  const ns=cur.nodes, K=0.012, REP=42000, CEN=0.006, LEN=170;
  for(let i=0;i<ns.length;i++){
    const a=ns[i];
    for(let j=i+1;j<ns.length;j++){
      const b=ns[j]; let dx=a.x-b.x,dy=a.y-b.y; let d2=dx*dx+dy*dy||1;
      let f=REP/d2; let d=Math.sqrt(d2); dx/=d;dy/=d;
      a.vx+=dx*f*0.0016;a.vy+=dy*f*0.0016;
      b.vx-=dx*f*0.0016;b.vy-=dy*f*0.0016;
    }
    a.vx+=(W/2-a.x)*CEN; a.vy+=(H/2-a.y)*CEN;
  }
  cur.edges.forEach(e=>{
    const a=cur.byId[e.a],b=cur.byId[e.b]; if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    let f=(d-LEN)*K; dx/=d;dy/=d;
    a.vx+=dx*f;a.vy+=dy*f; b.vx-=dx*f;b.vy-=dy*f;
  });
  ns.forEach(n=>{
    if(n===drag||n.fixed){n.vx=0;n.vy=0;}
    else{ n.vx*=0.86;n.vy*=0.86; n.x+=n.vx;n.y+=n.vy;
      n.x=Math.max(n.r+6,Math.min(W-n.r-6,n.x));
      n.y=Math.max(n.r+6,Math.min(H-n.r-6,n.y)); }
  });
  render(); requestAnimationFrame(step);
}

function render(){
  if(!cur)return;
  const pairSeen={};
  cur.edges.forEach(e=>{
    const a=cur.byId[e.a],b=cur.byId[e.b]; if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    // perpendicular offset so opposite/parallel edges don't overlap
    const pk=[e.a,e.b].sort().join("|"); pairSeen[pk]=(pairSeen[pk]||0);
    const dir = (e.a<e.b)?1:-1; const off=(pairSeen[pk]*1+ (countPair(pk)>1?dir*1:0))*22;
    pairSeen[pk]++;
    const mx=(a.x+b.x)/2 - dy/d*off, my=(a.y+b.y)/2 + dx/d*off;
    // trim to circle borders
    const ax=a.x+dx/d*a.r, ay=a.y+dy/d*a.r;
    let bx2=b.x-dx/d*(b.r+8), by2=b.y-dy/d*(b.r+8);
    e.path.setAttribute("d",`M${ax} ${ay} Q ${mx} ${my} ${bx2} ${by2}`);
    e.lab.setAttribute("x",mx); e.lab.setAttribute("y",my-3);
  });
  cur.nodes.forEach(n=>{ n.el.setAttribute("transform",`translate(${n.x} ${n.y})`); });
}
function countPair(pk){return cur.edges.filter(e=>[e.a,e.b].sort().join("|")===pk).length;}

function select(n){
  selected=n;
  const adj=new Set();
  if(n){adj.add(n.id);cur.edges.forEach(e=>{if(e.a===n.id)adj.add(e.b);if(e.b===n.id)adj.add(e.a);});}
  cur.nodes.forEach(m=>m.el.classList.toggle("dim", n&&!adj.has(m.id)));
  cur.edges.forEach(e=>{
    const on=n&&(e.a===n.id||e.b===n.id);
    e.path.classList.toggle("hl",on&&!e.neg);
    if(!e.neg)e.path.setAttribute("marker-end",on?"url(#arrhl)":"url(#arr)");
  });
  if(n)showInfo(n);
}
function showInfo(n){
  if(!n.info)return;
  document.getElementById("nodeinfo").innerHTML=
    `<h3>${n.label} <span class="k">· ${GROUP_LABEL[n.g]||""}</span></h3><p>${n.info}</p>`;
}

function fillSide(key){
  const d=DATA[key];
  document.getElementById("side").innerHTML=
   `<h2>${d.title}</h2><span class="tag">${d.tag}</span>${d.desc}
    <div id="nodeinfo" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:10px">
    <p class="k">Наведи/кликни узел — пояснение здесь.</p></div>`;
}
function fillLegend(){
  const gs=[...new Set(cur.nodes.map(n=>n.g))];
  document.getElementById("legend").innerHTML=
    gs.map(g=>`<div><i style="background:${COL[g]}"></i>${GROUP_LABEL[g]||g}</div>`).join("")
    +`<div style="margin-top:5px;color:var(--lin)">— — — отсутствующая стрелка (запрет/нет)</div>`;
}

/* ---------- tabs ---------- */
const tabs=document.getElementById("tabs");
ORDER.forEach(([key,label],i)=>{
  const t=document.createElement("div");t.className="tab"+(i===0?" on":"");t.textContent=label;
  t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on");load(key);};
  tabs.appendChild(t);
});
load("overview");
requestAnimationFrame(step);
</script>
</body>
</html>
